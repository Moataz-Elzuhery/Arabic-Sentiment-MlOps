# Smoke-sized defaults so a reviewer can run `dvc repro` on a CPU in a few minutes.
# Full-scale run (done on a Colab T4):  dvc repro -S train.max_samples=60000 -S train.epochs=2 -S evaluate.max_samples=40000
train:
  learning_rate: 3.0e-5
  batch_size: 16
  epochs: 1
  max_samples: 200
evaluate:
  max_samples: 200
  batch_size: 32
