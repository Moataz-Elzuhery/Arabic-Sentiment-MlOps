services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODEL_DIR: ${API_MODEL_DIR:-/app/models/v1}
      MONITORING_REFERENCE: /app/monitoring/reference.csv
      PREDICTION_LOG: /app/monitoring/data/predictions.jsonl
      DRIFT_WINDOW: ${DRIFT_WINDOW:-300}
      DRIFT_MIN_SAMPLES: ${DRIFT_MIN_SAMPLES:-100}
    volumes:
      - ./models:/app/models:ro
      - ./monitoring:/app/monitoring
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # BentoML + adaptive batching. Started only on request:
  #   docker compose --profile bento up -d bento
  bento:
    profiles: ["bento"]
    build:
      context: .
      dockerfile: Dockerfile.bento
    ports:
      - "3000:3000"
    environment:
      MODEL_DIR: ${API_MODEL_DIR:-/app/models/v1}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-32}
      MAX_LATENCY_MS: ${MAX_LATENCY_MS:-2000}
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:3000/readyz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Canary release: nginx splits traffic between the stable model (v1) and the candidate (v2).
  #   $env:CANARY_PCT=5; docker compose --profile canary up -d --build
  #   CANARY_PCT in 1..100;  rollback: $env:CANARY_ENABLED=0; docker compose --profile canary up -d router
  api_v1:
    profiles: ["canary"]
    build: .
    image: arabic-sentiment-api:local
    environment:
      MODEL_DIR: ${STABLE_MODEL_DIR:-/app/models/v1}
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  api_v2:
    profiles: ["canary"]
    build: .
    image: arabic-sentiment-api:local
    environment:
      MODEL_DIR: ${CANARY_MODEL_DIR:-/app/models/v2}
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  router:
    profiles: ["canary"]
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    environment:
      CANARY_PCT: ${CANARY_PCT:-5}
      CANARY_ENABLED: ${CANARY_ENABLED:-1}
    volumes:
      - ./canary/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api_v1:
        condition: service_healthy
      api_v2:
        condition: service_healthy

  # Monitoring stack (the `api` service above exposes /metrics and computes drift):
  #   docker compose --profile monitoring up -d --build
  #   Prometheus :9090   Alertmanager :9093   Grafana :3001
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      api:
        condition: service_healthy

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  alert_sink:
    profiles: ["monitoring"]
    image: python:3.11-slim
    command: ["python", "-u", "/app/alert_sink.py"]
    volumes:
      - ./monitoring/alert_sink.py:/app/alert_sink.py:ro

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
